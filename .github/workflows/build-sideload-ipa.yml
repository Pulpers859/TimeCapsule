name: Build Sideload IPA

# Manual, not on every push. This produces the file you upload to Signulous,
# and you only want it when you actually intend to install something.
on:
  workflow_dispatch:
    inputs:
      unlock_pro:
        description: 'Start with Pro on. Either way it can be switched in Settings > Sideload Build.'
        type: boolean
        default: true

permissions:
  # write, because the IPA is published as a release so it has a
  # direct link you can open on the phone itself.
  contents: write

concurrency:
  group: sideload-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Select and verify toolchain
        shell: bash
        run: |
          newest=$(ls -d /Applications/Xcode*.app 2>/dev/null \
            | grep -viE 'beta|release[_-]?candidate|_rc[0-9]*(\.app)?$' \
            | sort -V | tail -1)
          if [[ -z "$newest" ]]; then
            echo 'No Xcode found on the runner.' >&2
            exit 1
          fi
          echo "DEVELOPER_DIR=$newest/Contents/Developer" >> "$GITHUB_ENV"
          export DEVELOPER_DIR="$newest/Contents/Developer"
          xcodebuild -version

      # Built unsigned on purpose.
      #
      # Signulous re-signs whatever it is given with its own certificate, so
      # signing here would only be thrown away — and signing properly would
      # need an Apple Developer account, which is the thing this route exists
      # to avoid. `CODE_SIGNING_ALLOWED=NO` is what makes that possible
      # without one.
      #
      # Note what is *not* overridden: `CODE_SIGN_ENTITLEMENTS`. It used to be
      # blanked here alongside the identity, which looked harmless — codesign
      # is the only thing that reads it, and codesign is not running. But it
      # meant the .app reached the re-signer with no App Group declared, and a
      # re-signer cannot preserve an entitlement that was never in the bundle.
      # That is why the app and the widget were reading separate settings
      # stores. Leaving it in place cannot break an unsigned archive.
      - name: Archive
        shell: bash
        run: |
          set -o pipefail
          # ATTIC_SIDELOAD is always set here: it is what compiles in the Pro
          # switch in Settings, and a sideload build should always have it.
          # ATTIC_SIDELOAD_PRO only decides which way the switch starts.
          flags="ATTIC_SIDELOAD"
          if [[ "${{ inputs.unlock_pro }}" == "true" ]]; then
            flags="$flags ATTIC_SIDELOAD_PRO"
            echo 'Building with Pro on by default.'
          else
            echo 'Building with Pro off by default.'
          fi
          xcodebuild archive \
            -project 'TimeCapsule.xcodeproj' \
            -scheme 'TimeCapsule' \
            -configuration 'Release' \
            -destination 'generic/platform=iOS' \
            -archivePath 'build/Attic.xcarchive' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            "ATTIC_EXTRA_SWIFT_FLAGS=$flags" 2>&1 | tee archive.log
          status=${PIPESTATUS[0]}
          if [[ "$status" -ne 0 ]]; then exit "$status"; fi

      # Ad-hoc signed so the App Group survives into the bundle.
      #
      # `CODE_SIGNING_ALLOWED=NO` does not merely skip the signature — it
      # skips the step that *generates* the entitlements blob, so an unsigned
      # archive contains no App Group declaration anywhere, however correctly
      # the .entitlements files are configured. That was verified, not
      # assumed: the archive report below said the group was missing even
      # after the build stopped blanking `CODE_SIGN_ENTITLEMENTS`.
      #
      # Ad-hoc signing (`--sign -`) needs no certificate, no provisioning
      # profile and no Apple Developer account, and it does embed
      # entitlements. The signature itself is thrown away when Signulous
      # re-signs; the point is to hand the re-signer a bundle that declares
      # the group, because it cannot preserve what was never there.
      #
      # Nested code first, then the app: signing a bundle seals its contents,
      # so signing the app before the extension invalidates the app's seal.
      - name: Ad-hoc sign so entitlements are embedded
        shell: bash
        run: |
          set -euo pipefail
          app="build/Attic.xcarchive/Products/Applications/TimeCapsule.app"

          codesign --force --sign - --timestamp=none \
            --entitlements 'Config/AtticWidget.entitlements' \
            "$app/PlugIns/AtticWidget.appex"

          codesign --force --sign - --timestamp=none \
            --entitlements 'Config/Attic.entitlements' \
            "$app"

          echo '--- app entitlements'
          codesign -d --entitlements :- "$app" 2>/dev/null || true
          echo '--- widget entitlements'
          codesign -d --entitlements :- "$app/PlugIns/AtticWidget.appex" 2>/dev/null || true

      # An .ipa is a zip with the .app inside a folder called Payload. That
      # is the whole format; there is no Apple tool needed to make one.
      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail
          app="build/Attic.xcarchive/Products/Applications/TimeCapsule.app"
          if [[ ! -d "$app" ]]; then
            echo "No .app in the archive at $app" >&2
            ls -R build/Attic.xcarchive/Products >&2 || true
            exit 1
          fi

          # Checked rather than assumed: a missing widget still produces a
          # perfectly valid .ipa, and you would only find out when the widget
          # was not on your home screen.
          if [[ ! -d "$app/PlugIns/AtticWidget.appex" ]]; then
            echo 'AtticWidget.appex is not embedded in the app.' >&2
            ls -R "$app/PlugIns" >&2 || true
            exit 1
          fi
          echo "Widget embedded: yes"

          mkdir -p out/Payload
          cp -R "$app" out/Payload/
          (cd out && zip -qry "Attic.ipa" Payload)
          rm -rf out/Payload

          size=$(du -h out/Attic.ipa | cut -f1)
          echo "Built out/Attic.ipa ($size)"
          echo "IPA_SIZE=$size" >> "$GITHUB_ENV"

      # Reported rather than assumed. The symptom of a missing App Group is
      # the widget quietly disagreeing with the app, which is invisible here
      # and confusing on the phone, so the build fails outright rather than
      # shipping a bundle that will behave that way. If the group is present
      # here and the app still warns on the phone, the re-signer dropped it
      # and nothing in this repository can fix that.
      - name: Verify the App Group is embedded
        shell: bash
        run: |
          set -uo pipefail
          app="build/Attic.xcarchive/Products/Applications/TimeCapsule.app"
          group='group.Patrick-App.TimeCapsule'
          missing=0
          for bundle in "$app" "$app/PlugIns/AtticWidget.appex"; do
            if codesign -d --entitlements :- "$bundle" 2>/dev/null | grep -q "$group"; then
              echo "OK   $bundle declares $group"
            else
              echo "FAIL $bundle does not declare $group" >&2
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            echo 'The app and the widget would read separate settings stores.' >&2
            exit 1
          fi

      - name: Upload IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Attic-ipa
          path: 'out/Attic.ipa'
          if-no-files-found: error
          retention-days: 30

      # Artifacts can only be downloaded from a signed-in desktop browser,
      # which is no use when the phone doing the installing is the only
      # device to hand. A release asset on a public repo has a plain direct
      # link that Safari on the phone can open and Signulous can be pointed at.
      - name: Publish as a release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="sideload-${{ github.run_number }}"
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" 'out/Attic.ipa' \
            --title "Attic sideload build ${{ github.run_number }}" \
            --notes "Unsigned build of ${{ github.sha }} for signing with Signulous. Pro on by default: ${{ inputs.unlock_pro }}." \
            --prerelease
          url="${{ github.server_url }}/${{ github.repository }}/releases/download/$tag/Attic.ipa"
          echo "IPA_URL=$url" >> "$GITHUB_ENV"
          echo "Direct link: $url"

      - name: How to install this
        shell: bash
        run: |
          cat <<NOTE
          ============================================================
          Download this straight onto the iPhone:

            $IPA_URL

            1. Open that link in Safari on the phone.
            2. Give it to Signulous and sign it.
            3. Install from Signulous.

          It is also attached to this run under "Artifacts", wrapped in
          a zip, if you would rather use a computer.

          Known limits of a sideloaded build:
            - The widget may not share settings with the app if the App
              Group does not survive re-signing. If the widget shows a
              photo you hid, that is why.
            - Purchases cannot work. Pro is a switch instead, in
              Settings > Sideload Build.
          ============================================================
          NOTE

      - name: Upload archive log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sideload-archive-log
          path: 'archive.log'
          if-no-files-found: warn
          retention-days: 7
