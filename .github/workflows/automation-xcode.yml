name: Xcode Build

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xcode-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  xcode:
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: '.'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Run Xcode build
        shell: bash
        run: |
          set -o pipefail
          args=(
            -project 'TimeCapsule.xcodeproj'
            -scheme 'TimeCapsule'
            -configuration 'Debug'
            -sdk 'iphonesimulator'
            -destination 'generic/platform=iOS Simulator'
            -derivedDataPath 'DerivedData'
            -resultBundlePath 'xcode-result.xcresult'
            CODE_SIGNING_ALLOWED=NO
            build
          )
          xcodebuild "${args[@]}" 2>&1 | tee xcode.log
          xcode_status=${PIPESTATUS[0]}
          if [[ "$xcode_status" -ne 0 ]]; then exit "$xcode_status"; fi
          find DerivedData/Build/Products -name PrivacyInfo.xcprivacy -print -quit | grep -q .

      - name: Upload Xcode diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xcode-diagnostics
          path: |
            './xcode.log'
            './xcode-result.xcresult'
          if-no-files-found: warn
          retention-days: 14
