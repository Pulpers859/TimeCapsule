name: Xcode Build and Test

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xcode-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  xcode:
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: '.'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # `macos-latest` is a label GitHub rolls forward on its own schedule,
      # and this build hard-requires the iOS 26 SDK: DesignSystem.swift uses
      # GlassEffectContainer and .glassEffect, PlaceNameLookup.swift uses
      # MKReverseGeocodingRequest. The Windows job already pins its
      # toolchain; these macOS jobs pinned nothing, so the only compiler that
      # ever sees TimeCapsule/ and AtticWidget/ could change with no commit.
      # Selecting the newest installed Xcode makes that explicit, and the SDK
      # assertion turns a runner rollback into one clear line instead of a
      # wall of unresolved-symbol errors.
      - name: Select and verify toolchain
        shell: bash
        run: |
          # Betas excluded: a plain version sort puts Xcode_26.1_beta.app
          # above Xcode_26.0.app, so on an image carrying both, the step
          # added to make the compiler deterministic would have picked the
          # prerelease one. The bare `Xcode.app` symlink sorts below
          # `Xcode_*` and is ignored either way.
          newest=$(ls -d /Applications/Xcode*.app 2>/dev/null \
            | grep -viE 'beta|release[_-]?candidate|_rc[0-9]*(\.app)?$' \
            | sort -V | tail -1)
          if [[ -z "$newest" ]]; then
            echo 'No Xcode found on the runner.' >&2
            exit 1
          fi
          echo "DEVELOPER_DIR=$newest/Contents/Developer" >> "$GITHUB_ENV"
          export DEVELOPER_DIR="$newest/Contents/Developer"
          xcodebuild -version
          sdk=$(xcodebuild -showsdks | sed -n 's/.*-sdk iphonesimulator\([0-9][0-9.]*\).*/\1/p' | sort -V | tail -1)
          echo "Newest iOS simulator SDK: ${sdk:-none}"
          major=${sdk%%.*}
          if [[ -z "$major" || "$major" -lt 26 ]]; then
            echo "This project requires the iOS 26 SDK or newer; runner has ${sdk:-none}." >&2
            exit 1
          fi
      # `test`, not `build`, and on a real booted simulator.
      #
      # Until now this job only proved the app compiled. Nothing in CI ever
      # ran a line of it: the SwiftPM jobs cover seven pure-Foundation files
      # in AtticShared and zero files from TimeCapsule/ or AtticWidget/. That
      # is why repeated audit rounds kept finding defects in framework
      # behaviour rather than in logic -- SwiftUI update coalescing, task
      # capture semantics, PhotoKit exceptions, layout at accessibility text
      # sizes. None of those are visible to a compiler; all are visible to a
      # simulator.
      - name: Pick a simulator
        shell: bash
        run: |
          set -o pipefail
          # Taken from what the image actually has, rather than pinned to a
          # device name. Names come and go with each Xcode release, and a
          # stale one fails as "destination not found" rather than as
          # anything that says what to do about it.
          id=$(xcrun simctl list devices available \
            | sed -n '/-- iOS /,/^-- /p' \
            | grep iPhone \
            | tail -1 \
            | grep -oE '[0-9A-Fa-f-]{36}' \
            | head -1)
          if [[ -z "$id" ]]; then
            echo 'No available iOS iPhone simulator on this runner.' >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "Using simulator $id"
          echo "SIMULATOR_ID=$id" >> "$GITHUB_ENV"

      - name: Run Xcode tests
        shell: bash
        run: |
          set -o pipefail
          args=(
            -project 'TimeCapsule.xcodeproj'
            -scheme 'TimeCapsule'
            -configuration 'Debug'
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID"
            -derivedDataPath 'DerivedData'
            -resultBundlePath 'xcode-result.xcresult'
            CODE_SIGNING_ALLOWED=NO
            test
          )
          xcodebuild "${args[@]}" 2>&1 | tee xcode.log
          xcode_status=${PIPESTATUS[0]}
          if [[ "$xcode_status" -ne 0 ]]; then exit "$xcode_status"; fi
          # A test action that executes zero tests still exits 0, so the run
          # is only evidence if something actually ran.
          if ! grep -qE 'Executed [0-9]+ test|Test Suite .* passed' xcode.log; then
            echo 'xcodebuild test reported no executed tests.' >&2
            exit 1
          fi
          # Both manifests, named individually.
          #
          # `-print -quit` stopped at the first match anywhere under Products,
          # so the app's own manifest satisfied it and the check could not
          # fail for the case it was added to catch: neither manifest has a
          # pbxproj entry, both rely on a synchronized folder group
          # classifying them as resources, and it is the widget's that is
          # newer and the widget's whose group membership is the open
          # question. A missing manifest is refused at upload with
          # ITMS-91053, which is far too late to find out.
          app_manifest=$(find DerivedData/Build/Products -path '*/TimeCapsule.app/PrivacyInfo.xcprivacy' -print -quit)
          widget_manifest=$(find DerivedData/Build/Products -path '*/AtticWidget.appex/PrivacyInfo.xcprivacy' -print -quit)
          if [[ -z "$app_manifest" ]]; then
            echo 'PrivacyInfo.xcprivacy is missing from TimeCapsule.app' >&2
            exit 1
          fi
          if [[ -z "$widget_manifest" ]]; then
            echo 'PrivacyInfo.xcprivacy is missing from AtticWidget.appex' >&2
            exit 1
          fi
          echo "Found $app_manifest"
          echo "Found $widget_manifest"

      - name: Upload Xcode diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xcode-diagnostics
          path: |
            './xcode.log'
            './xcode-result.xcresult'
          if-no-files-found: warn
          retention-days: 14
