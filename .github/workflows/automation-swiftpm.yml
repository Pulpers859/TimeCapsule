name: Swift Package Tests

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swift-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: '.'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Run Swift tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          swift test --enable-xctest --parallel 2>&1 | Tee-Object -FilePath swift-test.log
          if ($LASTEXITCODE -ne 0) { throw "Swift tests failed with exit code $LASTEXITCODE." }
          ./scripts/Assert-SwiftTestEvidence.ps1 -LogPath swift-test.log
      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: swift-package-test-log
          path: './swift-test.log'
          if-no-files-found: ignore
          retention-days: 7
